<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 1 Map — ResLife First Impressions Hub</title>
<style>
  :root{
    --navy:#0b1626;
    --teal-dark:#0f7a6e;
    --teal:#16a394;
    --teal-pale:#e2f6f2;
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#1c2733;
    --muted:#7c8a99;
    --line:#eef1f5;
    --green:#3fb37f; --green-bg:#e6f7ee;
    --purple:#7c5cbf; --purple-bg:#efe9fb;
    --orange:#f0a323; --orange-bg:#fef2df;
    --red:#e35660; --red-bg:#fdeaec;
    --cyan:#3fb8c4; --cyan-bg:#e3f6f8;
    --blue:#4a90d9; --blue-bg:#e8f2fc;
    --pink:#ef6c9b; --pink-bg:#fdeaf1;
    --shadow:0 6px 18px rgba(15,30,45,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
  }
  .back-bar{ background:var(--navy); padding:10px 16px; }
  .back-bar a{
    color:var(--teal); text-decoration:none; font-size:13px; font-weight:700;
    display:inline-flex; align-items:center; gap:6px;
  }
  .back-bar a svg{ width:18px; height:18px; flex-shrink:0; }
  header{
    position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line);
    padding:16px 16px 14px; z-index:5;
  }
  .brand{ display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:2px; }
  .brand img{ width:22px; height:22px; }
  .brand span{
    font-size:11px; letter-spacing:0.14em; font-weight:800; color:var(--teal-dark);
    text-transform:uppercase;
  }
  header h1{ margin:2px 0 0; font-size:17px; font-weight:800; text-align:center; }
  .other-floor{
    display:block; text-align:center; margin-top:8px; font-size:12.5px; font-weight:700;
    color:var(--teal-dark); text-decoration:none;
  }
  main{ max-width:520px; margin:0 auto; padding:16px; }
  .map-card{
    background:var(--card); border-radius:16px; box-shadow:var(--shadow);
    padding:10px; margin-bottom:16px;
  }
  .map-img-wrap{ position:relative; width:100%; line-height:0; }
  .map-img{ width:100%; height:auto; display:block; border-radius:10px; }
  .img-pin{
    position:absolute; width:26px; height:26px; border-radius:50%;
    border:2px solid #fff; color:#fff; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    transform:translate(-50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,0.35);
    cursor:pointer; padding:0; text-decoration:none;
  }
  .img-pin.selected{
    width:34px; height:34px;
    box-shadow:0 0 0 4px rgba(22,163,148,0.45), 0 2px 8px rgba(0,0,0,0.4);
  }
  .door-pin{
    position:absolute; width:18px; height:18px; border-radius:50%;
    border:2px dashed rgba(15,122,110,0.55); background:transparent;
    transform:translate(-50%,-50%); pointer-events:none;
  }
  .door-pin.selected{
    width:32px; height:32px; border:3px solid #fff; background:var(--teal-dark);
    box-shadow:0 0 0 5px rgba(22,163,148,0.5), 0 2px 8px rgba(0,0,0,0.4);
    animation:doorPulse 1.5s ease-out infinite;
  }
  @keyframes doorPulse{
    0%{box-shadow:0 0 0 0 rgba(22,163,148,0.55), 0 2px 8px rgba(0,0,0,0.4);}
    70%{box-shadow:0 0 0 14px rgba(22,163,148,0), 0 2px 8px rgba(0,0,0,0.4);}
    100%{box-shadow:0 0 0 0 rgba(22,163,148,0), 0 2px 8px rgba(0,0,0,0.4);}
  }
  .legend-list{ display:flex; flex-direction:column; gap:7px; margin-bottom:16px; }
  .legend-row{
    display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:600;
    color:var(--muted); padding:8px 10px; border-radius:9px; cursor:pointer;
    transition:background .15s,color .15s; text-decoration:none;
  }
  .legend-row:hover{ background:var(--teal-pale); color:var(--teal-dark); }
  .legend-row.active{ background:var(--teal-pale); color:var(--teal-dark); font-weight:800; }
  .legend-num{
    width:22px; height:22px; border-radius:50%; color:#fff; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex:0 0 22px;
  }
  .room-detail{ background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px; }
  .rd-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .rd-num{
    width:30px; height:30px; border-radius:50%; background:var(--teal-dark); color:#fff;
    font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; flex:0 0 30px;
  }
  .room-detail h3{ margin:0; font-size:17px; }
  .rd-desc{ margin:0 0 12px; font-size:13.5px; color:var(--muted); line-height:1.5; }
  .rd-entrance{
    display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700;
    color:var(--teal-dark); margin-bottom:14px;
  }
  .btn-secondary{
    display:inline-flex; align-items:center; gap:6px; background:var(--red-bg); color:#c23a52;
    border:none; border-radius:12px; padding:12px 16px; font-size:13.5px; font-weight:800;
    text-decoration:none; cursor:pointer; width:100%; justify-content:center;
  }
</style>
</head>

const doors = [{"letter":"A","x":60.1,"y":22.4},{"letter":"B","x":51.5,"y":29.8},{"letter":"C","x":46.7,"y":45.3},{"letter":"D","x":36.8,"y":43.0},{"letter":"E","x":20.4,"y":41.5},{"letter":"F","x":9.2,"y":45.3},{"letter":"G","x":7.8,"y":65.2},{"letter":"H","x":20.4,"y":68.2},{"letter":"J","x":46.8,"y":58.6}];

function ic(name){
  const icons = {
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><path d="M12 21s-7-7.5-7-12a7 7 0 0 1 14 0c0 4.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>',
    external:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>'
  };
  return icons[name]||'';
}

document.getElementById('pins').innerHTML = rooms.map(r =>
  `<button class="img-pin" data-id="${r.id}" style="left:${r.x}%;top:${r.y}%;background:${r.color};" onclick="selectRoom(${r.id})">${r.num}</button>`
).join('');

document.getElementById('doorpins').innerHTML = doors.map(d =>
  `<div class="door-pin" data-letter="${d.letter}" style="left:${d.x}%;top:${d.y}%;"></div>`
).join('');

function selectDoors(letters){
  document.querySelectorAll('.door-pin').forEach(el =>
    el.classList.toggle('selected', letters.includes(el.dataset.letter))
  );
}

document.getElementById('legend').innerHTML = rooms.map(r =>
  `<div class="legend-row" data-id="${r.id}" onclick="selectRoom(${r.id})"><span class="legend-num" style="background:${r.color};">${r.num}</span>${r.name}</div>`
).join('');

function selectRoom(id){
  const r = rooms.find(x => x.id === id);
  document.querySelectorAll('.img-pin').forEach(el => el.classList.toggle('selected', parseInt(el.dataset.id) === id));
  document.querySelectorAll('.legend-row').forEach(el => el.classList.toggle('active', parseInt(el.dataset.id) === id));
  const isWorshipCenter = r.name.includes('Worship Center');
  document.getElementById('detail').innerHTML = `
    <div class="rd-head"><div class="rd-num">${r.num}</div><h3>${r.name}</h3></div>
    <p class="rd-desc">${r.desc}</p>
    <div class="rd-entrance">${ic('pin')} Nearest Entrance: ${r.entrance}</div>
    ${isWorshipCenter ? `<a class="btn-secondary" href="seating.html" target="_blank">View Seating Chart ${ic('external')}</a>` : ''}
  `;
  try{ history.replaceState(null, '', '#room-'+id); }catch(e){}
}

(function(){
  const parts = (location.hash||'').replace('#','').split(',');
  let roomId = null;
  const doorLetters = [];
  parts.forEach(p=>{
    if(p.startsWith('room-')) roomId = parseInt(p.replace('room-',''));
    if(p.startsWith('door-')) doorLetters.push(p.replace('door-','').toUpperCase());
  });
  const match = rooms.find(r => r.id === roomId);
  selectRoom(match ? match.id : rooms[0].id);
  if(doorLetters.length) selectDoors(doorLetters);
})();
